<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OmniProfile</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --primary: #18181b;
        --primary-fg: #ffffff;
        --danger: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #fafafa;
          --muted: #a1a1aa;
          --border: #3f3f46;
          --primary: #fafafa;
          --primary-fg: #18181b;
          --danger: #f87171;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0; padding: 16px;
        background: var(--bg); color: var(--fg);
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0 0 12px; font-size: 16px; }
      p { margin: 0 0 12px; }
      .muted { color: var(--muted); }
      .error { color: var(--danger); }
      .name { font-weight: 600; margin-bottom: 2px; }
      .stats { display: flex; gap: 8px; margin: 12px 0; padding: 0; list-style: none; }
      .stats li { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px; text-align: center; }
      .stats strong { display: block; font-size: 16px; }
      .stats span { color: var(--muted); font-size: 12px; }
      .actions { display: flex; flex-direction: column; gap: 8px; }
      button, a.button {
        display: block; width: 100%; padding: 8px 12px; border-radius: 8px;
        border: 1px solid var(--border); background: transparent; color: inherit;
        font: inherit; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer;
      }
      button.primary, a.button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
      button:disabled { opacity: .6; cursor: progress; }
      button:focus-visible, a:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
